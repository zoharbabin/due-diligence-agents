[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dd-agents"
version = "1.22.1"
description = "Open-source forensic M&A due diligence — 13 AI agents read your data room across 9 domains, cross-reference findings no single reviewer connects, and cite every one to an exact quote"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{name = "Zohar Babin"}]
keywords = [
    "due-diligence", "mergers-and-acquisitions", "contract-analysis",
    "legal-tech", "ai-agents", "private-equity", "risk-analysis",
    "cross-domain", "corporate-development", "data-room",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Office/Business",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Legal Industry",
    "Typing :: Typed",
]
# All core dependencies are permissively licensed (Apache 2.0, MIT, BSD).
# The optional [pdf] extra is pypdfium2 (Apache-2.0/BSD-3) plus pikepdf (MPL-2.0, used unmodified).
dependencies = [
    "claude-agent-sdk>=0.2.121,<0.3",
    "pydantic>=2.4",
    "openpyxl>=3.1.3",
    "networkx>=3.0",
    "rapidfuzz>=3.0",
    "defusedxml>=0.7",  # safe XML parsing for the sanctions list downloads (screening/)
    # markitdown needs onnxruntime (via magika), which has no wheels for Python 3.15 yet.
    # On 3.15 install it without dependencies (`pip install --no-deps markitdown`);
    # extraction/office_convert.py then loads it with a magika stand-in. The lines
    # marked 3.15 are markitdown's own dependencies. Drop all 3.15 lines and the
    # `< '3.15'` marker once onnxruntime ships cp315 wheels.
    "markitdown[docx,xlsx,pptx]>=0.1; python_version < '3.15'",
    "pandas>=2.0; python_version >= '3.15'",
    "lxml>=5.0; python_version >= '3.15'",
    "charset-normalizer>=3.0; python_version >= '3.15'",
    "requests>=2.28; python_version >= '3.15'",
    "mammoth>=1.8",
    "markdownify>=0.13",
    "python-pptx>=1.0",
    "beautifulsoup4>=4.12",
    "xlrd>=2.0",
    "click>=8.0",
    "rich>=13.0",
    "prompt-toolkit>=3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# PDF text extraction: pypdfium2 (PDFium; Apache-2.0 or BSD-3, no dependencies, py3-none wheels).
# pikepdf (qpdf; MPL-2.0) repairs truncated or damaged PDFs before PDFium reads them.
pdf = ["pypdfium2>=5.0", "pikepdf>=9.0"]
# Page classifier (Rust, MIT). Finds pages with no text layer so only those go to OCR.
# Optional: without it, a page-text length rule does the same job.
pdf-fast = ["pdf-inspector>=1.26,<1.27"]
# Rust Office-to-markdown converter. The PyPI name is firecrawl-anydoc (import name: anydoc).
# The PyPI project named plain "anydoc" is a different, empty package. Optional: opt in with
# extraction.office_backend = "anydoc". Without it, markitdown is used.
office-fast = ["firecrawl-anydoc>=0.2.4,<0.3"]
vector = ["chromadb>=0.4"]
ocr = ["pytesseract>=0.3", "Pillow>=13.0", "pdf2image>=1.16"]
glm-ocr = ["mlx-vlm>=0.1", "pypdfium2>=5.0", "Pillow>=13.0"]
# Cross-platform GLM-OCR via Ollama (needs a running ollama daemon + a pulled
# glm-ocr model). The mlx-vlm path above is Apple-Silicon only.
glm-ocr-ollama = ["ollama>=0.3", "pypdfium2>=5.0", "Pillow>=13.0"]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "ruff==0.17.5",
    "mypy==2.4.1",
    "pre-commit>=3.0",
    # API tests: the app extra plus httpx for the FastAPI TestClient.
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]
docs = ["mkdocs-material>=9.7.7"]
# Local API for the desktop app (`dd-agents serve`).
app = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.urls]
Homepage = "https://github.com/zoharbabin/due-diligence-agents"
Repository = "https://github.com/zoharbabin/due-diligence-agents"
Documentation = "https://zoharbabin.com/due-diligence-agents/"
Issues = "https://github.com/zoharbabin/due-diligence-agents/issues"
Changelog = "https://github.com/zoharbabin/due-diligence-agents/releases"

[project.scripts]
dd-agents = "dd_agents.cli:main"

[project.entry-points."dd_agents.specialists"]
# External agent packages register here. Each entry point must be a callable
# that returns an AgentDescriptor instance. Example:
#   my_agent = "my_package.agents:create_esg_descriptor"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH"]

[tool.ruff.lint.per-file-ignores]
# FastAPI reads route annotations at runtime, so these imports cannot move under TYPE_CHECKING.
"src/dd_agents/api/**" = ["TC001", "TC002", "TC003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Per-test timeout (pytest-timeout). A unit test must never block on a real
# network/SDK/subprocess call; the "thread" method interrupts even C-level
# blocking I/O so a transient SDK-session stall can't wedge CI indefinitely.
# e2e/eval tests legitimately run longer — override with @pytest.mark.timeout.
timeout = 120
timeout_method = "thread"
markers = [
    "e2e: end-to-end tests (require API key, slow)",
    "eval: agent quality evaluation tests (require API key)",
    "slow: tests that take more than 1 minute",
    "local: deep validation tests, local-only (not for CI)",
    "gateway: provider-agnostic live test through an Anthropic-compatible gateway (requires DD_TEST_GATEWAY_URL)",
    "screening_live: downloads the real sanctions lists (requires DD_TEST_SCREENING_LIVE=1)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
log_cli = false
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
log_cli_date_format = "%H:%M:%S"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
# Third-party packages without stubs (pytesseract, etc.) trigger
# import-untyped errors.  Per-module overrides handle missing packages, but
# installed-without-stubs packages need this global disable.
# unused-ignore: Pillow stubs vary across versions (load() typed in some,
# untyped in others), so type: ignore comments may be needed locally but
# unused in CI, or vice versa.
disable_error_code = ["import-untyped", "unused-ignore"]

[[tool.mypy.overrides]]
module = [
    "anydoc.*",
    "pdf_inspector.*",
    "chromadb.*",
    "markitdown.*",
    "rapidfuzz.*",
    "pytesseract.*",
    "pdf2image.*",
    "PIL.*",
    "mlx_vlm.*",
    "pypdfium2.*",
    "ollama.*",
]
ignore_missing_imports = true
