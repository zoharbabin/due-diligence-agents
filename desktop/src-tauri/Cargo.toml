[package]
name = "due-diligence-agents"
version = "0.0.0"
description = "Due Diligence Agents desktop app"
authors = ["Zohar Babin"]
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
name = "dd_agents_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
getrandom = "0.3"
tauri-plugin-updater = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
