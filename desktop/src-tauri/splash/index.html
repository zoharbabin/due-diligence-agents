<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Due Diligence Agents</title>
    <style>
      body { font: 15px system-ui, sans-serif; display: grid; place-items: center; height: 100vh; margin: 0; color: #334155; background: #f8fafc; }
      .box { text-align: center; max-width: 28rem; padding: 1rem; }
      .spin { width: 28px; height: 28px; border: 3px solid #6366f1; border-top-color: transparent; border-radius: 50%; margin: 0 auto 1rem; animation: s 0.8s linear infinite; }
      @keyframes s { to { transform: rotate(360deg); } }
      #err { color: #b91c1c; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="spin" id="spin" role="status" aria-label="Starting"></div>
      <div id="msg">Starting…</div>
      <p id="err" role="alert"></p>
    </div>
    <script src="splash.js"></script>
  </body>
</html>
