name: Desktop UI

on:
  push:
    branches: [main]
    paths: ["desktop/**", "src/dd_agents/api/**", ".github/workflows/desktop-ui.yml"]
  pull_request:
    branches: [main]
    paths: ["desktop/**", "src/dd_agents/api/**", ".github/workflows/desktop-ui.yml"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ui:
    name: "UI lint, tests, build, E2E"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Install the API
        run: pip install -e "../..[dev]"
      - run: npx playwright install --with-deps chromium
      - name: End-to-end (real API, fake pipeline)
        run: npm run e2e
        env:
          DD_PYTHON: python
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces
          path: desktop/ui/test-results
          retention-days: 7

  shell:
    name: "Shell tests (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[app]"
      - name: Test the shell against the real server
        working-directory: desktop/src-tauri
        run: |
          export DD_DESKTOP_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          cargo test --locked
      - name: Lint
        working-directory: desktop/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
