name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release (e.g. v0.4.1)"
        required: true

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────
  # Gate: run full test suite before releasing
  # ──────────────────────────────────────────────

  quality-gate:
    name: "Quality Gate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev,pdf]" types-openpyxl types-networkx
      - name: Install markitdown without magika (no onnxruntime wheel on 3.15)
        run: pip install --no-deps "markitdown>=0.1"
      - name: Lint
        run: ruff check src/ tests/ && ruff format --check src/ tests/
      - name: Type check
        run: mypy src/ --strict
      - name: Unit tests
        run: pytest tests/unit/ -x -q
      - name: Integration tests
        run: pytest tests/integration/ -x -q -k "not test_agent_spawning"

  # ──────────────────────────────────────────────
  # Build Python package
  # ──────────────────────────────────────────────

  build:
    name: "Build Package"
    runs-on: ubuntu-latest
    needs: [quality-gate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
      - name: Install build tools
        run: pip install build
      - name: Build sdist and wheel
        run: python -m build
      - name: Verify CLI entry point
        run: |
          pip install dist/*.whl
          dd-agents version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  # ──────────────────────────────────────────────
  # Publish to PyPI (trusted publishing via OIDC)
  # ──────────────────────────────────────────────

  publish-pypi:
    name: "Publish to PyPI"
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  # ──────────────────────────────────────────────
  # Publish Docker image to GHCR + Docker Hub
  # ──────────────────────────────────────────────

  publish-docker:
    name: "Publish Docker Image"
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ secrets.DOCKERHUB_USERNAME }}/due-diligence-agents
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ──────────────────────────────────────────────
  # Sync Docker Hub repository description
  # ──────────────────────────────────────────────

  update-dockerhub-description:
    name: "Update Docker Hub Description"
    runs-on: ubuntu-latest
    needs: [publish-docker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update Docker Hub description
        # NOTE: DOCKERHUB_TOKEN must be a Docker Hub Personal Access Token with
        # Read/Write/Delete scope — the repo-description API (PATCH /v2/repositories/...)
        # rejects push-only tokens with 403. A push-scoped token is enough for
        # `docker push` but NOT for updating the description.
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/due-diligence-agents
          readme-filepath: ./DOCKERHUB.md
          short-description: "13 AI agents find what's buried in your contracts — cited, cross-referenced, exportable."

  # ──────────────────────────────────────────────
  # Update Homebrew formula with new version
  # ──────────────────────────────────────────────

  update-formula:
    name: "Update Homebrew Formula"
    runs-on: ubuntu-latest
    needs: [publish-pypi]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Update formula version and SHA256
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG}"
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid tag: $TAG"
            exit 1
          fi
          VERSION="${TAG#v}"

          # Wait for PyPI to propagate the new version
          for i in 1 2 3 4 5; do
            URL=$(curl -sf "https://pypi.org/pypi/dd-agents/${VERSION}/json" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          sdist = [u for u in data['urls'] if u['packagetype'] == 'sdist']
          print(sdist[0]['url'] if sdist else '')
          " 2>/dev/null)
            if [ -n "$URL" ]; then break; fi
            echo "Waiting for PyPI to propagate version ${VERSION}... (attempt $i)"
            sleep 15
          done

          if [ -z "$URL" ]; then
            echo "::warning::Could not fetch PyPI URL for version ${VERSION} — skipping formula update"
            exit 0
          fi

          SHA256=$(curl -sf "https://pypi.org/pypi/dd-agents/${VERSION}/json" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          sdist = [u for u in data['urls'] if u['packagetype'] == 'sdist']
          print(sdist[0]['digests']['sha256'] if sdist else '')
          ")

          sed -i "s|url \".*\"|url \"${URL}\"|" Formula/dd-agents.rb
          sed -i "s|sha256 \".*\"|sha256 \"${SHA256}\"|" Formula/dd-agents.rb

      - name: Commit formula update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/dd-agents.rb
          if git diff --cached --quiet; then
            echo "No formula changes to commit"
          else
            git commit -m "Update Homebrew formula to ${GITHUB_REF_NAME#v}"
            git push
          fi

      - name: Update Homebrew tap repo
        continue-on-error: true
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::TAP_GITHUB_TOKEN not set — skipping tap update"
            exit 0
          fi
          git clone https://x-access-token:${TAP_TOKEN}@github.com/zoharbabin/homebrew-due-diligence-agents.git /tmp/tap
          cp Formula/dd-agents.rb /tmp/tap/Formula/dd-agents.rb
          cd /tmp/tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/dd-agents.rb
          if git diff --cached --quiet; then
            echo "No tap formula changes to commit"
          else
            git commit -m "Update dd-agents to ${GITHUB_REF_NAME#v}"
            git push
          fi

  # ──────────────────────────────────────────────
  # Create GitHub Release with changelog
  # ──────────────────────────────────────────────

  github-release:
    name: "GitHub Release"
    runs-on: ubuntu-latest
    needs: [publish-pypi, publish-docker]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Generate release notes
        id: notes
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG}"
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid tag: $TAG"
            exit 1
          fi
          PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | grep -v "^${TAG}$" | head -1)
          if [ -n "$PREV_TAG" ]; then
            echo "## Changes since $PREV_TAG" > notes.md
            echo "" >> notes.md
            git log "$PREV_TAG".."$TAG" --pretty=format:"- %s" --no-merges >> notes.md
          else
            echo "## Initial release" > notes.md
          fi
          echo "" >> notes.md
          echo "---" >> notes.md
          echo "" >> notes.md
          echo "### Install" >> notes.md
          echo '```bash' >> notes.md
          echo "pip install dd-agents==${TAG#v}" >> notes.md
          echo '```' >> notes.md
          echo "" >> notes.md
          echo "### Docker" >> notes.md
          echo '```bash' >> notes.md
          echo "docker pull zoharbabin/due-diligence-agents:${TAG#v}" >> notes.md
          echo '```' >> notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          body_path: notes.md
          files: dist/*
          generate_release_notes: true
